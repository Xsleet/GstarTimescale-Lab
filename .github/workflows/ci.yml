name: Public experiment tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-tools:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python tools/check_public_tree.py
      - run: python -m unittest discover -s tests -v
      - run: python lab.py prepare --days 0.0416666666666667 --output Runs/ci-input-check
      - run: python lab.py inspect --workdir Runs/ci-input-check
      - run: python lab.py init --output Runs/ci-native-config
      - run: python lab.py inspect --workdir Runs/ci-native-config
      # Deliberately no access to the private solver or private repository.
