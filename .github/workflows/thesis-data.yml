name: Thesis Section 4.3 archived data
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  reproduce-archive:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'thesis-section43-data-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python tools/check_public_tree.py
      - run: python tools/thesis_section43.py fetch --kind analysis --output Runs/thesis43/data
      - run: python tools/thesis_section43.py analyze --data Runs/thesis43/data --output Runs/thesis43/report
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-section43-archive-report
          path: Runs/thesis43/report/
          retention-days: 14
      # This verifies archived calculations, not all printed thesis values.
      # No private runtime, core source, or solver execution is involved.
