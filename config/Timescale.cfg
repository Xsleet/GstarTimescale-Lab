* GSTAR native configuration: editable four-clock PFD starting point.
* 时间范围：开始时刻 + 持续秒数；864000 秒 = 10 天。
* 当前核心要求起始年份不大于 2026；输入须覆盖对应时段。
 Start time&session length   = 2026 01 01 00 00 00 864000 [GPST]
 Processing interval         = 10

+File Directory
* 所有相对路径基于实验工作目录，不是此 cfg 所在的 config 目录。
* 改输入位置：修改下面的 CLK/PFD 路径；-YEARDOY- 是年份+年积日。
* 改输出位置：修改 Project directory；execute 要求该目录不存在或为空。
 Project directory           = results
 GNSS Sp3 full name          = unused/-YEARDOY-.SP3
 GNSS Clk full name          = clk/SIM0MGNFIN_-YEARDOY-0000_01D_10S_CLK.CLK
 LEO Sp3 full name           = unused/-YEARDOY-.SP3
 LEO Clk full name           = clk/SIM0MGNFIN_-YEARDOY-0000_01D_10S_CLK.CLK
 ISL data directory          = unused/isl
 PFD data directory          = pfd
-File Directory

+Timescale Section
* 当前模板为 PFD：satellite + session.obj 中的 OBS P，不需要轨道。
 Timescale scope             = satellite
 Clock Trend state num       = 2
 Clock Harmonics state num   = 0
 Rank deficiency remedy      = GREENHALL
* 架构可选 centralized / distributed_if / distributed_ci。
 Estimation architecture     = centralized
 Distributed output mode     = auto
 SUMZERO constraint sigma    = 1e-14
-Timescale Section

+Orbit and Clock Section
* PFD 模板不使用 SP3；切换观测类型时需同步准备完整输入。
 GNSS Apriori orbit          = spp
 GNSS Apriori clock          = prec
 LEO Apriori orbit           = spp
 LEO Apriori clock           = prec
-Orbit and Clock Section

+Output Section
 Clock state output flag     = 1
 Log level                   = info
-Output Section
